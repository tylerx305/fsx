[package]
name = "fsx"
default-run = "fsx"
version = "0.1.0"
description = "FSX file explorer"
authors = ["FSX"]
edition = "2021"

[[bin]]
name = "fsx"
path = "src/main.rs"

[[bin]]
name = "fsx-helper"
path = "src/helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
sysinfo = "0.32"
walkdir = "2"
libc = "0.2"
notify = "6"
trash = "5.2"
